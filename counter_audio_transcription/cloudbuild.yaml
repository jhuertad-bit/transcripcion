# Contexto por defecto: repositorio padre. Desde esta carpeta usar _SOURCE_DIR=.
substitutions:
  _SOURCE_DIR: 'counter_audio_transcription'
  _ENABLE_DIARIZATION: 'false'
  _FILES_PER_WORKER: '5'
  _WHISPER_CPU_THREADS: '4'
  _WHISPER_MODEL: 'deepdml/faster-whisper-large-v3-turbo-ct2'
  _PROJECT_ID: ''
  _LOCATION: ''
  _REPOSITORY: ''
  _SERVICE_ACCOUNT: ''
  _ALLOWED_INPUT_BUCKETS: ''
  _OUTPUT_GCS_ROOT: ''
  _JOB_NAME: 'prd-utpbi-counter-audio-transcripcion'
  _HF_TOKEN_SOURCE: 'secret'
  _HF_SECRET: 'counter-hf-token'
  _HF_SECRET_VERSION: '1'
  _CPU: '4'
  _MEMORY: '16Gi'
  _TASK_TIMEOUT: '7200s'
  _BQ_SOURCE_TABLE: 'prd-utpbi-data-operation.raw_queue_smart.queuesmart_mp3_catalog'
  _BQ_SOURCE_LOCATION: ''
  _BQ_RESULTS_TABLE: ''
  _BQ_LOCATION: ''
  _MANIFEST_GCS_ROOT: ''
  _BATCH_MAX_FILES: '100'
  _PROCESS_DAY_FROM: ''
  _PROCESS_DAY_TO: ''
  _PARALLELISM: '2'
  _WORKFLOW_NAME: 'prd-utpbi-counter-audio-pipeline'
  _WORKFLOW_SERVICE_ACCOUNT: ''
steps:
  - id: validate
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args: ['${_SOURCE_DIR}/scripts/cloudbuild_deploy.sh', 'validate']
    env: &deploy_env
      - '_SOURCE_DIR=${_SOURCE_DIR}'
      - '_ENABLE_DIARIZATION=${_ENABLE_DIARIZATION}'
      - '_FILES_PER_WORKER=${_FILES_PER_WORKER}'
      - '_WHISPER_CPU_THREADS=${_WHISPER_CPU_THREADS}'
      - '_WHISPER_MODEL=${_WHISPER_MODEL}'
      - '_PROJECT_ID=${_PROJECT_ID}'
      - '_LOCATION=${_LOCATION}'
      - '_REPOSITORY=${_REPOSITORY}'
      - '_SERVICE_ACCOUNT=${_SERVICE_ACCOUNT}'
      - '_ALLOWED_INPUT_BUCKETS=${_ALLOWED_INPUT_BUCKETS}'
      - '_OUTPUT_GCS_ROOT=${_OUTPUT_GCS_ROOT}'
      - '_JOB_NAME=${_JOB_NAME}'
      - '_HF_TOKEN_SOURCE=${_HF_TOKEN_SOURCE}'
      - '_HF_SECRET=${_HF_SECRET}'
      - '_HF_SECRET_VERSION=${_HF_SECRET_VERSION}'
      - '_CPU=${_CPU}'
      - '_MEMORY=${_MEMORY}'
      - '_TASK_TIMEOUT=${_TASK_TIMEOUT}'
      - '_BQ_SOURCE_TABLE=${_BQ_SOURCE_TABLE}'
      - '_BQ_SOURCE_LOCATION=${_BQ_SOURCE_LOCATION}'
      - '_BQ_RESULTS_TABLE=${_BQ_RESULTS_TABLE}'
      - '_BQ_LOCATION=${_BQ_LOCATION}'
      - '_MANIFEST_GCS_ROOT=${_MANIFEST_GCS_ROOT}'
      - '_BATCH_MAX_FILES=${_BATCH_MAX_FILES}'
      - '_PROCESS_DAY_FROM=${_PROCESS_DAY_FROM}'
      - '_PROCESS_DAY_TO=${_PROCESS_DAY_TO}'
      - '_PARALLELISM=${_PARALLELISM}'
      - '_WORKFLOW_NAME=${_WORKFLOW_NAME}'
      - '_WORKFLOW_SERVICE_ACCOUNT=${_WORKFLOW_SERVICE_ACCOUNT}'
      - 'IMAGE_URI=${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/counter-audio-transcription:${BUILD_ID}'
  - id: tests
    name: 'python:3.11-slim-bookworm'
    entrypoint: python
    args:
      - '-c'
      - 'import os, unittest, sys; os.chdir("${_SOURCE_DIR}"); sys.path.insert(0, os.getcwd()); sys.exit(not unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover("tests")).wasSuccessful())'
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'WHISPER_MODEL=${_WHISPER_MODEL}', '-f', '${_SOURCE_DIR}/worker/Dockerfile', '-t', '${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/counter-audio-transcription:${BUILD_ID}', '${_SOURCE_DIR}']
  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/counter-audio-transcription:${BUILD_ID}']
  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args: ['${_SOURCE_DIR}/scripts/cloudbuild_deploy.sh', 'deploy']
    env: *deploy_env
images:
  - '${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/counter-audio-transcription:${BUILD_ID}'
timeout: '3600s'
options:
  logging: CLOUD_LOGGING_ONLY
