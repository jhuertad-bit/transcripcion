# Copiar a job.local.yaml. HF_TOKEN se configura como secreto, no aquí.
GCP_PROJECT: "YOUR_PROJECT_ID"
ALLOWED_INPUT_BUCKETS: "YOUR_COUNTER_INPUT_BUCKET"
OUTPUT_GCS_ROOT: "gs://YOUR_EXISTING_OUTPUT_BUCKET/counter/results"
MODEL_DEVICE: "cpu"
ENABLE_DIARIZATION: "false"
FILES_PER_WORKER: "5"
WHISPER_CPU_THREADS: "4"
WHISPER_COMPUTE_TYPE: "int8"
WHISPER_MODEL: "deepdml/faster-whisper-large-v3-turbo-ct2"
DIARIZATION_MODEL: "pyannote/speaker-diarization-community-1"
LANGUAGE: "es"
MIN_SPEAKERS: "1"
MAX_SPEAKERS: "6"
MIN_OVERLAP_RATIO: "0.5"
AMBIGUITY_MARGIN: "0.1"
PIPELINE_VERSION: "counter-v0.3.0"
MAX_AUDIO_SECONDS: "7200"
MAX_AUDIO_BYTES: "524288000"
# Opcional: habilitar solo después de crear la tabla y confirmar su ubicación.
# BQ_RESULTS_TABLE: "YOUR_PROJECT_ID.raw_counter_audios.counter_audios_transcripcion"
# BQ_LOCATION: "YOUR_BQ_LOCATION"
