main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("PROJECT_ID")}
          - location: ${sys.get_env("LOCATION")}
          - job: prd-utpbi-counter-piloto-202611
          - root: ${sys.get_env("MANIFEST_GCS_ROOT")}
          - batch: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - validate:
        switch:
          - condition: ${map.get(args, "process_day") == null}
            next: invalid
        next: day
    - day:
        assign:
          - day: ${args.process_day}
    - range:
        switch:
          - condition: ${not(day in ["2026-11-02", "2026-11-03", "2026-11-04", "2026-11-05", "2026-11-06", "2026-11-07"])}
            next: invalid
        next: prepare
    - invalid:
        raise: 'Enviar process_day entre 2026-11-02 y 2026-11-07'
    - prepare:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + job}
          body:
            overrides:
              taskCount: 1
              containerOverrides:
                - env:
                    - name: JOB_ROLE
                      value: prepare
                    - name: BATCH_ID
                      value: ${batch}
                    - name: PROCESS_DAY_FROM
                      value: ${day}
                    - name: PROCESS_DAY_TO
                      value: ${day}
          connector_params:
            timeout: 14400
    - manifest:
        assign:
          - uri: ${root + "/" + batch + ".json"}
          - parts: ${text.split(text.substring(uri, 5, len(uri)), "/")}
          - bucket: ${parts[0]}
          - object: ${text.substring(uri, 6 + len(bucket), len(uri))}
    - count:
        call: http.get
        args:
          url: ${"https://storage.googleapis.com/storage/v1/b/" + bucket + "/o/" + text.url_encode(object + ".meta.json") + "?alt=media"}
          auth:
            type: OAuth2
        result: manifest
    - empty:
        switch:
          - condition: ${manifest.body.count == 0}
            return:
              status: no_pending_files
              process_day: ${day}
              manifest_uri: ${uri}
    - worker:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + job}
          body:
            overrides:
              taskCount: ${manifest.body.task_count}
              containerOverrides:
                - env:
                    - name: JOB_ROLE
                      value: worker
                    - name: MANIFEST_URI
                      value: ${uri}
          connector_params:
            timeout: 86400
    - done:
        return:
          process_day: ${day}
          count: ${manifest.body.count}
          manifest_uri: ${uri}
