main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("PROJECT_ID")}
          - location: ${sys.get_env("LOCATION")}
          - job: ${sys.get_env("JOB_NAME")}
          - root: ${sys.get_env("MANIFEST_GCS_ROOT")}
          - batch: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - roles_resume:
        switch:
          - condition: ${map.get(args, "roles_only") == true}
            next: resume_manifest
        next: prepare
    - resume_manifest:
        assign:
          - uri: ${args.manifest_uri}
        next: classify_roles
    - prepare:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + job}
          body:
            overrides:
              taskCount: 1
              containerOverrides:
                - env:
                    - name: JOB_ROLE
                      value: prepare
                    - name: BATCH_ID
                      value: ${batch}
          connector_params:
            timeout: 14400
    - manifest_path:
        assign:
          - uri: ${root + "/" + batch + ".json"}
          - parts: ${text.split(text.substring(uri, 5, len(uri)), "/")}
          - bucket: ${parts[0]}
          - object: ${text.substring(uri, 6 + len(bucket), len(uri))}
    - read_manifest:
        call: http.get
        args:
          url: ${"https://storage.googleapis.com/storage/v1/b/" + bucket + "/o/" + text.url_encode(object + ".meta.json") + "?alt=media"}
          auth:
            type: OAuth2
        result: manifest
    - empty:
        switch:
          - condition: ${manifest.body.count == 0}
            return:
              status: no_pending_files
              manifest_uri: ${uri}
    - worker:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + job}
          body:
            overrides:
              taskCount: ${manifest.body.task_count}
              containerOverrides:
                - env:
                    - name: JOB_ROLE
                      value: worker
                    - name: MANIFEST_URI
                      value: ${uri}
          connector_params:
            timeout: 86400
        result: execution
    - roles_enabled:
        switch:
          - condition: ${sys.get_env("ROLE_ENABLED") == "true"}
            next: classify_roles
        next: done
    - classify_roles:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + job}
          body:
            overrides:
              taskCount: 1
              containerOverrides:
                - env:
                    - name: JOB_ROLE
                      value: roles
                    - name: MANIFEST_URI
                      value: ${uri}
          connector_params:
            timeout: 86400
        result: role_execution
        next: roles_done
    - roles_done:
        return:
          status: roles_completed
          manifest_uri: ${uri}
    - done:
        return:
          manifest_uri: ${uri}
          count: ${manifest.body.count}
          execution: ${execution}
