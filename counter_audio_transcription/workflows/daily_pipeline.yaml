main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("PROJECT_ID")}
          - location: ${sys.get_env("LOCATION")}
          - job: ${sys.get_env("JOB_NAME")}
          - root: ${sys.get_env("MANIFEST_GCS_ROOT")}
          - batch: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - prepare:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + job}
          body:
            overrides:
              taskCount: 1
              containerOverrides:
                - env:
                    - name: JOB_ROLE
                      value: prepare
                    - name: BATCH_ID
                      value: ${batch}
          connector_params:
            timeout: 14400
    - manifest_path:
        assign:
          - uri: ${root + "/" + batch + ".json"}
          - parts: ${text.split(text.substring(uri, 5, len(uri)), "/")}
          - bucket: ${parts[0]}
          - object: ${text.substring(uri, 6 + len(bucket), len(uri))}
    - read_manifest:
        call: http.get
        args:
          url: ${"https://storage.googleapis.com/storage/v1/b/" + bucket + "/o/" + text.url_encode(object + ".meta.json") + "?alt=media"}
          auth:
            type: OAuth2
        result: manifest
    - empty:
        switch:
          - condition: ${manifest.body.count == 0}
            return:
              status: no_pending_files
              manifest_uri: ${uri}
    - worker:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + job}
          body:
            overrides:
              taskCount: ${manifest.body.task_count}
              containerOverrides:
                - env:
                    - name: JOB_ROLE
                      value: worker
                    - name: MANIFEST_URI
                      value: ${uri}
          connector_params:
            timeout: 86400
        result: execution
    - done:
        return:
          manifest_uri: ${uri}
          count: ${manifest.body.count}
          execution: ${execution}
