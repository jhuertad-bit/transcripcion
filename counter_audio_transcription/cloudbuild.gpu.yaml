# Construye/publica solamente. No despliega CPU, GPU ni Workflows.
# Desde el repositorio padre, enviar counter_audio_transcription como fuente.
steps:
  - name: python:3.11-slim-bookworm
    entrypoint: python
    args: ['-m', 'unittest', 'discover', '-s', 'tests']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'worker/Dockerfile.gpu', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/serializa-audio-repo/counter-audio-transcription-gpu:$BUILD_ID', '.']
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/serializa-audio-repo/counter-audio-transcription-gpu:$BUILD_ID'
timeout: 3600s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
