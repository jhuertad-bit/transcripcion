main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("PROJECT_ID")}
          - location: ${sys.get_env("LOCATION")}
          - job: ${"projects/" + project + "/locations/" + location + "/jobs/" + sys.get_env("JOB_NAME")}
          - run_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
          - date_from: ${default(map.get(args, "date_from"), "")}
          - date_to: ${default(map.get(args, "date_to"), "")}
          - reprocess: ${default(map.get(args, "reprocess"), false)}
          - daily: ${date_from == "" and date_to == ""}
          - completed_days: 0
    - prepare_catalogs_and_plan:
        call: run_job
        args:
          job: ${job}
          run_id: ${run_id}
          date_from: ${date_from}
          date_to: ${date_to}
          reprocess: ${reprocess}
          action: prepare
          catalog_load_id: ""
    - read_plan:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            location: US
            useLegacySql: false
            timeoutMs: 10000
            maxResults: 1000
            parameterMode: NAMED
            query: >-
              SELECT FORMAT_DATE('%F',process_date) AS day, catalog_load_id
              FROM `prd-utpbi-data-operation.raw_cita_promotor.hist_mentores_execution_plan`
              WHERE execution_id=@execution_id ORDER BY process_date
            queryParameters:
              - name: execution_id
                parameterType:
                  type: STRING
                parameterValue:
                  value: ${run_id}
        result: plan
    - remember_query:
        assign:
          - plan_job_id: ${plan.jobReference.jobId}
    - check_plan_ready:
        switch:
          - condition: ${not plan.jobComplete}
            next: wait_plan
        next: each_day
    - wait_plan:
        call: googleapis.bigquery.v2.jobs.getQueryResults
        args:
          projectId: ${project}
          jobId: ${plan_job_id}
          location: US
          timeoutMs: 10000
          maxResults: 1000
        result: plan
        next: check_plan_ready
    - each_day:
        for:
          value: row
          in: ${default(map.get(plan, "rows"), [])}
          steps:
            - process_day:
                call: process_day
                args:
                  job: ${job}
                  run_id: ${run_id + "_" + row.f[0].v}
                  date_from: ${row.f[0].v}
                  date_to: ${row.f[0].v}
                  reprocess: ${reprocess}
                  action: run
                  catalog_load_id: ${row.f[1].v}
                  daily: ${daily}
            - count_day:
                assign:
                  - completed_days: ${completed_days + 1}
    - more_days:
        switch:
          - condition: ${map.get(plan, "pageToken") != null}
            next: next_page
        next: done
    - next_page:
        call: googleapis.bigquery.v2.jobs.getQueryResults
        args:
          projectId: ${project}
          jobId: ${plan_job_id}
          location: US
          maxResults: 1000
          pageToken: ${plan.pageToken}
        result: plan
        next: each_day
    - done:
        return:
          execution_id: ${run_id}
          completed_days: ${completed_days}

process_day:
  params: [job, run_id, date_from, date_to, reprocess, action, catalog_load_id, daily]
  steps:
    - principal:
        call: run_job
        args:
          job: ${job}
          run_id: ${run_id}
          date_from: ${date_from}
          date_to: ${date_to}
          reprocess: ${reprocess}
          action: ${action}
          catalog_load_id: ${catalog_load_id}
    - daily_retries:
        switch:
          - condition: ${daily}
            next: retries
        next: done
    - retries:
        for:
          value: attempt
          range: [1, 2]
          steps:
            - retry_pending:
                call: run_job
                args:
                  job: ${job}
                  run_id: ${run_id + "_retry_" + string(attempt)}
                  date_from: ${date_from}
                  date_to: ${date_to}
                  reprocess: false
                  action: run
                  catalog_load_id: ${catalog_load_id}
    - done:
        return: null

run_job:
  params: [job, run_id, date_from, date_to, reprocess, action, catalog_load_id]
  steps:
    - execute:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${job}
          body:
            overrides:
              taskCount: 1
              containerOverrides:
                - args: ${["-m", "worker.main", action]}
                  env:
                    - name: RUN_ID
                      value: ${run_id}
                    - name: DATE_FROM
                      value: ${date_from}
                    - name: DATE_TO
                      value: ${date_to}
                    - name: REPROCESS
                      value: ${string(reprocess)}
                    - name: CATALOG_LOAD_ID
                      value: ${catalog_load_id}
          connector_params:
            timeout: 28800
        result: execution
    - done:
        return: ${execution}
